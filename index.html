<!DOCTYPE html>
<html>
  <head>
    <title>
      ARTG's BFDIA 5b time hopper!
    </title>
  </head>
  <body>
    <!-- Intro -->
    This is ARandomTaiwaneseGuy(<a href = https://www.youtube.com/@ARandomTaiwaneseGuy>YT</a>)/yuGesenawiaTmodnaRA(<a href = https://www.speedrun.com/users/yuGesenawiaTmodnaRA>speedrun.com</a>)/RandTWGuy(Github)'s BFDIA 5b time hopper.
    <br>
    <!-- Put the canvas here -->
    <canvas id="myCanvas" width="300" height="200" style="border:1px solid #ccc;"></canvas>
    <script>
      // canvas
      const canvas = document.getElementById('myCanvas');
      const ctx = canvas.getContext('2d');

      // start xy of THE  block
      let block_x = 50
      let block_y = 50
      
      // width and height of a single block
      let width = 100
      let height = 100

      // Rectangle
      ctx.fillStyle = '#FFD700';
      ctx.fillRect(block_x, block_y, width, height);

      //text style
      ctx.font = "12px Arial";
      ctx.fillStyle = "#000000";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      
      const centerX = block_x + (width / 2);
      const centerY = block_y + (height / 2);
      ctx.fillText("Korzen, GOAT", centerX, centerY);
    </script>
    <br>
    <b>More stuff coming soon!</b>
  </body>
</html>
